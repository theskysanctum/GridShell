<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0710; }
  .blob {
    position: absolute;
    width: 60%;
    height: 60%;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.65;
    mix-blend-mode: screen;
  }
  .b1 { background: #ff5d8f; top: -10%;  left: -10%; animation: float1 18s ease-in-out infinite; }
  .b2 { background: #5d7bff; top: 20%;   left: 40%;  animation: float2 24s ease-in-out infinite; }
  .b3 { background: #7a5dff; top: 45%;   left: -5%;  animation: float3 21s ease-in-out infinite; }
  .b4 { background: #ff9d5d; top: 55%;   left: 55%;  animation: float4 27s ease-in-out infinite; opacity: 0.45; }

  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(10%,8%) scale(1.15); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-8%,10%) scale(0.9); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6%,-10%) scale(1.1); } }
  @keyframes float4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-10%,-6%) scale(1.05); } }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</body>
</html>
