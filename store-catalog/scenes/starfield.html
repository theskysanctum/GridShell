<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000308; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let cx, cy;
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      cx = canvas.width / 2;
      cy = canvas.height / 2;
    }
    resize();
    addEventListener('resize', resize);

    const STAR_COUNT = 400;
    const stars = Array.from({ length: STAR_COUNT }, () => newStar());

    function newStar() {
      return {
        x: (Math.random() - 0.5) * 2,
        y: (Math.random() - 0.5) * 2,
        z: Math.random() * 1 + 0.01,
      };
    }

    let shootingStar = null;
    let shootingTimer = 0;

    function step() {
      ctx.fillStyle = 'rgba(0,3,8,0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const speed = 0.0008;
      for (const s of stars) {
        s.z -= speed;
        if (s.z <= 0.01) Object.assign(s, newStar(), { z: 1 });

        const k = 1 / s.z;
        const sx = cx + s.x * k * cx;
        const sy = cy + s.y * k * cy;
        if (sx < 0 || sx > canvas.width || sy < 0 || sy > canvas.height) continue;

        const r = (1 - s.z) * 2.2;
        const alpha = Math.min(1, (1 - s.z) * 1.3);
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(r, 0.3), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }

      shootingTimer--;
      if (!shootingStar && shootingTimer <= 0) {
        shootingStar = {
          x: Math.random() * canvas.width * 0.6,
          y: Math.random() * canvas.height * 0.3,
          vx: 6 + Math.random() * 4,
          vy: 3 + Math.random() * 2,
          life: 40,
        };
      }

      if (shootingStar) {
        const s = shootingStar;
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 4, s.y - s.vy * 4);
        ctx.stroke();
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        if (s.life <= 0) {
          shootingStar = null;
          shootingTimer = 200 + Math.random() * 300;
        }
      }

      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  </script>
</body>
</html>
