<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060910; }
  .sky {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 120%, #0c1524 0%, #060910 60%);
  }
  .band {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 60%;
    filter: blur(40px);
    mix-blend-mode: screen;
    opacity: 0.55;
    border-radius: 50%;
  }
  .b1 { top: -10%;  background: linear-gradient(90deg, transparent, #35e6a8, transparent); animation: drift1 22s ease-in-out infinite; }
  .b2 { top: 5%;    background: linear-gradient(90deg, transparent, #4f7cff, transparent); animation: drift2 28s ease-in-out infinite; opacity: 0.4; }
  .b3 { top: 15%;   background: linear-gradient(90deg, transparent, #9b5cff, transparent); animation: drift3 34s ease-in-out infinite; opacity: 0.35; }

  @keyframes drift1 {
    0%, 100% { transform: translateX(-6%) translateY(0) scaleY(1); }
    50%      { transform: translateX(6%) translateY(4%) scaleY(1.2); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translateX(5%) translateY(2%) scaleY(1.1); }
    50%      { transform: translateX(-7%) translateY(-3%) scaleY(0.9); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translateX(-4%) translateY(5%) scaleY(0.95); }
    50%      { transform: translateX(8%) translateY(-2%) scaleY(1.15); }
  }

  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="band b1"></div>
  <div class="band b2"></div>
  <div class="band b3"></div>
  <canvas id="stars"></canvas>
  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize();
    addEventListener('resize', resize);

    const stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * 1,
      y: Math.random() * 0.6,
      r: Math.random() * 1.2 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.0,
    }));

    function frame(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        const twinkle = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase);
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.15 + 0.5 * twinkle})`;
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
